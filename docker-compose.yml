services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: doanhnhan
      POSTGRES_USER: doanhnhan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doanhnhan -d doanhnhan"]
      interval: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://doanhnhan:${POSTGRES_PASSWORD}@db:5432/doanhnhan
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/data/media
      - private_media:/data/private_media
      - backups:/data/backups

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [web]
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/data/media:ro
      # KHÔNG gắn private_media vào nginx: giấy tờ xác minh chỉ tải qua trang quản trị có kiểm tra quyền.

volumes:
  pgdata:
  media:
  private_media:
  backups:

