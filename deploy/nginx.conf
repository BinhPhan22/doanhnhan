# Giới hạn tần suất yêu cầu chống tấn công DoS và quét tự động (được include trong http block)
limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;

server {
    listen 80;
    server_name doanhnhan.wiki www.doanhnhan.wiki;
    client_max_body_size 12m;

    # Nén Gzip tối ưu tốc độ tải trang
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Các Header bảo mật chuẩn OWASP
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Chặn truy cập các tệp ẩn nhạy cảm (.env, .git, .dockerignore...)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Chặn các bot quét mã độc PHP/WordPress phổ biến
    location ~* (\.php|wp-admin|wp-login|xmlrpc\.php|phpmyadmin|\.sql|\.bak)$ {
        return 404;
        access_log off;
    }

    # Phục vụ tệp tĩnh ảnh tải lên công khai
    location /media/ {
        alias /data/media/;
        expires 30d;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=2592000, immutable";
        # Chỉ phục vụ hình ảnh, không cho trình duyệt thực thi mã độc
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'";
    }

    # Giới hạn tần suất cho trang đăng nhập/đăng ký chống brute-force
    location ~ ^/(dang-nhap|dang-ky)/ {
        limit_req zone=login_limit burst=10 nodelay;
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Định tuyến chính tới ứng dụng Django Gunicorn
    location / {
        limit_req zone=req_limit_per_ip burst=50 nodelay;
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }
}

