<div class="field{% if full %} full{% endif %}">
  {% if field.field.widget.input_type == "checkbox" %}
    <label class="check">{{ field }} <span>{{ field.label }}{% if field.field.required %} <span class="required" style="color:#DC2626;font-weight:700;margin-left:2px">*</span>{% endif %}</span></label>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="required" style="color:#DC2626;font-weight:700;margin-left:2px">*</span>{% endif %}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<p class="hint">{{ field.help_text }}</p>{% endif %}
  {% for e in field.errors %}<p class="field-error">{{ e }}</p>{% endfor %}
</div>
